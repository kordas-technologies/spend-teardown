name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # official Docker images: ubuntu-latest no longer ships every Python the package supports
        python: ["3.9", "3.12", "3.14"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: unit tests (includes the no-network import test)
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
